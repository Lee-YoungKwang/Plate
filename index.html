<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>세계 지각판 및 지진대/화산대 지도 (비율 고정형)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 1. 전체 화면 중앙 정렬 및 바깥 배경 설정 */
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #1e272e;
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* ★ 추가: 태블릿에서 길게 눌렀을 때 텍스트 선택/콜아웃 메뉴 차단 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 2. 16:9 비율 컨테이너 */
        #screen-wrapper {
            position: relative;
            width: 100vw;
            height: auto;
            aspect-ratio: 16 / 9;
            max-height: 100vh;
            max-width: calc(100vh * 16 / 9);
            background-color: #aadaff;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        #map { width: 100%; height: 100%; }
        
        /* ★ 추가: 그리기/지우개 모드일 때 브라우저 기본 터치 제스처(스크롤/줌) 차단 */
        #map.drawing-mode {
            touch-action: none;
        }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 8px;
            font-size: 16px; font-weight: bold; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .legend {
            position: absolute; bottom: 3%; left: 2%;
            background: rgba(255, 255, 255, 0.95); padding: 12px 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); z-index: 1000; font-size: 13px; font-weight: bold;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        .legend-item:last-child { margin-bottom: 0; }
        .circle { width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.5); }
        .eq-circle { background-color: #f1c40f; } 
        .vol-circle { background-color: #e74c3c; }
        
        .leaflet-control-layers { 
            font-size: 13px; font-weight: bold; padding: 8px; 
            margin-bottom: 3% !important; margin-right: 2% !important; 
        }

        .toolbox {
            position: absolute; bottom: 3%; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 8px 12px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); z-index: 1000; 
            display: flex; gap: 8px; align-items: center; justify-content: center;
        }
        /* ★ 변경: 버튼 크기를 키워 손가락 터치 적합하게 */
        .tool-btn {
            padding: 10px 14px; font-size: 14px; font-weight: bold; border: 2px solid #ccc;
            border-radius: 6px; cursor: pointer; background: white; transition: 0.2s;
            white-space: nowrap;
            min-height: 44px; /* iOS HIG 권장 최소 터치 영역 */
            touch-action: manipulation; /* 더블탭 줌 방지로 반응 속도 개선 */
        }
        .tool-btn:hover { background: #f0f0f0; }
        .tool-btn.active { border-color: #2c3e50; background: #e8f4f8; box-shadow: inset 0 0 5px rgba(0,0,0,0.1); }
        
        /* ★ 추가: 레이어 컨트롤 체크박스 크기 확대(터치 친화) */
        .leaflet-control-layers-overlays label {
            padding: 4px 0;
            font-size: 14px;
        }
        .leaflet-control-layers input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
</head>

    <div id="screen-wrapper">
        <div id="loading">지도를 설정하는 중입니다...</div>
        <div id="map"></div>
        
        <div class="toolbox">
            <button id="btn-move" class="tool-btn active">🖐️ 지도 이동</button>
            <button id="btn-yellow" class="tool-btn">🟡 펜 (노랑)</button>
            <button id="btn-red" class="tool-btn">🔴 펜 (빨강)</button>
            <button id="btn-eraser" class="tool-btn">🧽 부분 지우기</button>
            <button id="btn-clear" class="tool-btn">🗑️ 모두 지우기</button>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="circle eq-circle"></div>지진 (Earthquake)</div>
            <div class="legend-item"><div class="circle vol-circle"></div>화산 (Volcano)</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        // ★ 변경: tap:false → Pointer Events와 Leaflet 기본 tap 핸들러 충돌 방지
        const bounds = [[-85, -35], [85, 335]];
        const map = L.map('map', { 
            maxBounds: bounds, maxBoundsViscosity: 1.0, 
            worldCopyJump: false, zoomSnap: 0,
            tap: false
        });
        map.fitBounds(bounds);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        const boundariesLayer = L.layerGroup(); 
        const earthquakesLayer = L.layerGroup();
        const volcanoesLayer = L.layerGroup();

        fetch('https://cdn.jsdelivr.net/gh/fraxen/tectonicplates@master/GeoJSON/PB2002_boundaries.json')
            .then(res => res.json())
            .then(data => {
                const lineStyle = { color: '#000000', weight: 3.5, opacity: 0.8, interactive: false }; 
                L.geoJSON(data, { style: lineStyle }).addTo(boundariesLayer);
                L.geoJSON(data, {
                    style: lineStyle,
                    coordsToLatLng: coords => new L.LatLng(coords[1], coords[0] + 360)
                }).addTo(boundariesLayer);
                document.getElementById('loading').style.display = 'none';
                
                map.invalidateSize();
                map.fitBounds(bounds);
            });

        // 데이터 분석 및 중복 제거 (원본 그대로)
        const rows = allData.trim().split('\n');
        const seenCoordinates = new Set();
        
        rows.forEach(row => {
            const parts = row.split(',');
            if(parts.length >= 4) {
                const type = parts[0].trim();
                const lat = parseFloat(parts[1]);
                let lng = parseFloat(parts[2]);
                const uniqueKey = `${type}_${lat}_${lng}`;
                
                if (!seenCoordinates.has(uniqueKey)) {
                    seenCoordinates.add(uniqueKey);
                    if (lng < -30) { lng += 360; } 

                    const isEarthquake = (type === '지진');
                    const fillColor = isEarthquake ? '#f1c40f' : '#e74c3c'; 

                    const marker = L.circleMarker([lat, lng], {
                        radius: 4.5, color: '#ffffff', weight: 1.5,
                        fillColor: fillColor, fillOpacity: 0.9,
                        interactive: false 
                    });

                    if (isEarthquake) marker.addTo(earthquakesLayer);
                    else marker.addTo(volcanoesLayer);
                }
            }
        });

        const overlayMaps = {
            "<span style='color:#000000'>⚫</span> 판의 경계선": boundariesLayer,
            "<span style='color:#f1c40f'>🟡</span> 지진대": earthquakesLayer,
            "<span style='color:#c0392b'>🔥</span> 화산대": volcanoesLayer
        };
        
        L.control.layers(null, overlayMaps, { 
            collapsed: false, 
            position: 'bottomright'
        }).addTo(map);

        // =========================================================================
        // ★ 터치/마우스 통합 그리기·지우기 로직 (Pointer Events API 사용)
        // =========================================================================
        let drawMode = null; 
        let isDrawing = false;
        let currentLine = null;
        let drawnLines = []; 
        let activePointerId = null; // 멀티터치에서 첫 손가락만 추적

        const mapEl = document.getElementById('map');
        const btnMove = document.getElementById('btn-move');
        const btnYellow = document.getElementById('btn-yellow');
        const btnRed = document.getElementById('btn-red');
        const btnEraser = document.getElementById('btn-eraser');
        const btnClear = document.getElementById('btn-clear');

        function setDrawMode(mode, activeBtn) {
            drawMode = mode;
            [btnMove, btnYellow, btnRed, btnEraser].forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active'); 

            // 진행 중인 그리기 강제 종료
            isDrawing = false;
            currentLine = null;
            activePointerId = null;

            if (mode === 'yellow' || mode === 'red') { 
                map.dragging.disable(); 
                map.doubleClickZoom.disable();
                mapEl.style.cursor = 'crosshair'; 
                mapEl.classList.add('drawing-mode'); // 터치 제스처 차단
            } else if (mode === 'eraser') {
                map.dragging.disable(); 
                map.doubleClickZoom.disable();
                mapEl.style.cursor = 'help'; 
                mapEl.classList.add('drawing-mode');
            } else { 
                map.dragging.enable(); 
                map.doubleClickZoom.enable();
                mapEl.style.cursor = ''; 
                mapEl.classList.remove('drawing-mode');
            }
        }

        // 버튼 이벤트 (click은 터치+마우스 모두 정상 작동)
        btnMove.addEventListener('click', () => setDrawMode(null, btnMove));
        btnYellow.addEventListener('click', () => setDrawMode('yellow', btnYellow));
        btnRed.addEventListener('click', () => setDrawMode('red', btnRed));
        btnEraser.addEventListener('click', () => setDrawMode('eraser', btnEraser));
        
        btnClear.addEventListener('click', () => {
            drawnLines.forEach(line => map.removeLayer(line));
            drawnLines = []; 
        });

        // ★ 좌표 거리 기반 지우개: 손가락 위치로부터 18px 이내의 선을 삭제
        function eraseNearPoint(latlng) {
            const eraseRadiusPx = 18; // 손가락 터치 영역 (픽셀)
            const pointerPx = map.latLngToContainerPoint(latlng);
            
            const toErase = [];
            drawnLines.forEach(line => {
                const latlngs = line.getLatLngs();
                for (let i = 0; i < latlngs.length; i++) {
                    const segPx = map.latLngToContainerPoint(latlngs[i]);
                    const dx = segPx.x - pointerPx.x;
                    const dy = segPx.y - pointerPx.y;
                    if (Math.sqrt(dx*dx + dy*dy) < eraseRadiusPx) {
                        toErase.push(line);
                        break;
                    }
                }
            });
            
            toErase.forEach(line => {
                map.removeLayer(line);
                drawnLines = drawnLines.filter(l => l !== line);
            });
        }

        // 화면 좌표 → 지도 latlng 변환
        function getLatLngFromPointer(e) {
            const rect = mapEl.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            return map.containerPointToLatLng([x, y]);
        }

        // ★ Pointer Events: 마우스/터치/펜 통합 처리
        mapEl.addEventListener('pointerdown', function(e) {
            if (!drawMode) return;
            // 멀티터치 중에는 첫 손가락만 처리
            if (activePointerId !== null) return;
            
            activePointerId = e.pointerId;
            isDrawing = true;
            
            // 포인터 캡처: 손가락이 지도 밖으로 나가도 이벤트 계속 수신
            try { mapEl.setPointerCapture(e.pointerId); } catch(err) {}
            
            const latlng = getLatLngFromPointer(e);

            if (drawMode === 'eraser') {
                eraseNearPoint(latlng);
                e.preventDefault();
                return;
            }

            const color = drawMode === 'yellow' ? '#f1c40f' : '#e74c3c';
            currentLine = L.polyline([latlng], { 
                color: color, weight: 6, opacity: 0.9, lineJoin: 'round', 
                lineCap: 'round', interactive: false 
            }).addTo(map);
            drawnLines.push(currentLine); 
            
            e.preventDefault();
        });

        mapEl.addEventListener('pointermove', function(e) {
            if (!isDrawing) return;
            if (e.pointerId !== activePointerId) return;
            
            const latlng = getLatLngFromPointer(e);
            
            if (drawMode === 'eraser') {
                eraseNearPoint(latlng);
            } else if ((drawMode === 'yellow' || drawMode === 'red') && currentLine) {
                currentLine.addLatLng(latlng);
            }
            e.preventDefault();
        });

        function endPointer(e) {
            if (e.pointerId !== activePointerId) return;
            isDrawing = false;
            currentLine = null;
            activePointerId = null;
            try { mapEl.releasePointerCapture(e.pointerId); } catch(err) {}
        }
        mapEl.addEventListener('pointerup', endPointer);
        mapEl.addEventListener('pointercancel', endPointer);
        mapEl.addEventListener('pointerleave', endPointer);

        // ★ 추가: 그리기 모드에서 브라우저 기본 터치 제스처(스크롤, 핀치줌, 길게누르기 메뉴) 차단
        mapEl.addEventListener('touchstart', function(e) {
            if (drawMode) e.preventDefault();
        }, { passive: false });
        mapEl.addEventListener('touchmove', function(e) {
            if (drawMode) e.preventDefault();
        }, { passive: false });
        // 컨텍스트 메뉴(길게누르기 시 나오는 메뉴) 차단
        mapEl.addEventListener('contextmenu', function(e) {
            if (drawMode) e.preventDefault();
        });

        // 창 크기 변경 대응
        window.addEventListener('resize', function() {
            setTimeout(() => {
                map.invalidateSize();
                map.fitBounds(bounds);
            }, 100);
        });
        // ★ 추가: 태블릿 화면 회전 대응
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                map.invalidateSize();
                map.fitBounds(bounds);
            }, 300);
        });
        
    </script>
